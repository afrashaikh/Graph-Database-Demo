services:
  arangodb:
    image: arangodb:latest
    container_name: arangodb-local
    restart: unless-stopped
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: your_local_password
    volumes:
      - arangodb_data:/var/lib/arangodb3

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-local
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  arangodb_data:
  ollama_data: